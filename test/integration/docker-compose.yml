# SeaweedFS S3 gateway for squirrel's S3 integration tests.
#
#   docker compose -f test/integration/docker-compose.yml up -d
#   export SQUIRREL_TEST_S3_ENDPOINT=http://127.0.0.1:8333
#   export SQUIRREL_TEST_S3_ACCESS_KEY=squirreltest
#   export SQUIRREL_TEST_S3_SECRET_KEY=squirreltestsecret
#   go test -tags integration ./sync/ -run TestS3 -v
#   docker compose -f test/integration/docker-compose.yml down -v
#
# See README.md in this directory for details.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -s3 -dir=/data
      -s3.config=/etc/seaweedfs/s3config.json
      -master.volumeSizeLimitMB=64
    ports:
      - "8333:8333" # S3 API
    volumes:
      - ./s3config.json:/etc/seaweedfs/s3config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8333/status"]
      interval: 3s
      timeout: 3s
      retries: 20
