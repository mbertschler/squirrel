version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*github.com/mbertschler/squirrel/store.Store).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Unsetenv

formatters:
  enable:
    - gofmt
    - goimports
