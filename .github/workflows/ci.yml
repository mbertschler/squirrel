name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise tools
        uses: jdx/mise-action@v2

      # Native deps for `go build -tags wailsdesktop` below. Wails v3
      # alpha targets WebKitGTK 6.0 (which pulls in GTK4 + libsoup-3.0);
      # Ubuntu 24.04 (ubuntu-latest) ships these as libwebkitgtk-6.0-dev.
      # The default build/vet/test don't need any of this — only the
      # wailsdesktop-tagged build links to the webview.
      - name: Install Wails native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            pkg-config

      # Catch regressions in cmd/squirrel-desktop/main_wailsdesktop.go,
      # which is excluded from the default build by its build tag and
      # would otherwise never be compiled in CI.
      - name: go build (wailsdesktop tag, native Wails)
        run: go build -tags wailsdesktop ./cmd/squirrel-desktop

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  integration:
    name: integration (s3 / seaweedfs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Bring up the SeaweedFS S3 gateway from the same fixture developers
      # run locally (test/integration/), so CI exercises the documented path.
      - name: Start SeaweedFS
        run: docker compose -f test/integration/docker-compose.yml up -d

      # Poll the published S3 port from the host (curl is on the runner). A
      # bare GET returns 403 once the gateway is serving; curl without -f
      # exits 0 on any HTTP response and non-zero only while the port is not
      # yet listening. This is the same reachability the test needs.
      - name: Wait for S3 endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8333; then
              echo "S3 endpoint ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "S3 endpoint did not become ready within 60s" >&2
          docker compose -f test/integration/docker-compose.yml logs
          exit 1

      - name: go test (integration tag)
        env:
          SQUIRREL_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          SQUIRREL_TEST_S3_ACCESS_KEY: squirreltest
          SQUIRREL_TEST_S3_SECRET_KEY: squirreltestsecret
        run: go test -tags integration ./sync/ -run TestS3 -v

      - name: SeaweedFS logs
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs

      - name: Stop SeaweedFS
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise tools
        uses: jdx/mise-action@v2

      - name: golangci-lint
        run: golangci-lint run
