name: Docs audit

# The audit documents (design/*.md, SAFETY-AUDIT.md) drift differently from
# the reference pages: a finding goes stale when the issue it links closes
# and nobody annotates the entry. That needs issue state, so it can't live
# in `go test ./...` like the other documentation guards (#193). It runs on
# a cadence instead and reports into a tracking issue — advisory, never a
# gate on a pull request, and it never edits a document.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-audit
  cancel-in-progress: false

jobs:
  stale-references:
    name: stale issue references
    runs-on: ubuntu-latest
    if: github.repository == 'mbertschler/squirrel'
    steps:
      - uses: actions/checkout@v4

      - name: Scan for findings whose issue has closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/audit_stale_references.py
